general { disable_loading_bar = true; hide_cursor = true; grace = 2; ignore_empty_input = true }
background {
    monitor =
    path = __HOME__/.local/share/arch-pl-os/assets/ekran-blokady.png
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    brightness = 0.50
}
image {
    monitor =
    path = __HOME__/.local/share/arch-pl-os/assets/logo.png
    size = 145
    border_size = 0
    rounding = -1
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text = ARCH PL OS
    color = rgba(247,247,249,1.0)
    font_size = 28
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = POLSKI  •  PROSTY  •  TWÓJ
    color = rgba(220,0,52,1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 78
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(247,247,249,1.0)
    font_size = 62
    font_family = JetBrainsMono Nerd Font ExtraLight
    position = 0, -190
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] LC_ALL=pl_PL.UTF-8 date +"%A, %d %B %Y"
    color = rgba(165,168,176,1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -260
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 440, 60
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(220,0,52,1.0)
    inner_color = rgba(16,17,20,0.92)
    font_color = rgba(247,247,249,1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##A5A8B0">HASŁO UŻYTKOWNIKA $USER</span>
    fail_color = rgba(220,0,52,1.0)
    fail_text = <span foreground="##FF355D">BŁĘDNE HASŁO  •  $FAIL</span>
    position = 0, -360
    halign = center
    valign = center
}
