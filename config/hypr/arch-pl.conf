# ARCH PL OS — polskie środowisko Hyprland
$mainMod = SUPER
$terminal = alacritty
$menu = wofi --show drun --allow-images --insensitive

env = LANG,pl_PL.UTF-8
env = LANGUAGE,pl_PL:pl
env = LC_TIME,pl_PL.UTF-8
env = GTK_THEME,Adwaita:dark
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(dc0034ff) rgba(ffffffff) 45deg
    col.inactive_border = rgba(34363daa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2.2
    active_opacity = 0.99
    inactive_opacity = 0.94
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(000000bb)
        offset = 0 6
    }
    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.012
        contrast = 1.06
        brightness = 0.84
        vibrancy = 0.08
    }
}

dwindle { preserve_split = true; smart_split = true; smart_resizing = true }

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

animations {
    enabled = true
    bezier = plPlynnie, 0.22, 1, 0.36, 1
    bezier = plWyjscie, 0.4, 0, 1, 1
    bezier = plSprezyna, 0.16, 1.12, 0.30, 1
    animation = windowsIn, 1, 5, plSprezyna, popin 90%
    animation = windowsOut, 1, 3, plWyjscie, popin 94%
    animation = windowsMove, 1, 5, plPlynnie
    animation = fade, 1, 4, plPlynnie
    animation = layersIn, 1, 4, plSprezyna, slide
    animation = layersOut, 1, 3, plWyjscie, slide
    animation = workspaces, 1, 6, plSprezyna, slide
}

exec-once = $HOME/.local/share/arch-pl-os/bin/start
exec-once = hypridle -q -c $HOME/.config/hypr/arch-pl-idle.conf
exec-once = dunst

bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, L, exec, hyprlock --config $HOME/.config/hypr/arch-pl-lock.conf
bind = $mainMod SHIFT, W, exec, $HOME/.local/share/arch-pl-os/bin/zmien-tapete
bind = $mainMod, PRINT, exec, grim -g "$(slurp)" - | swappy -f -
bind = , PRINT, exec, grim "$HOME/Obrazy/Zrzuty ekranu/$(date +%Y-%m-%d_%H-%M-%S).png"
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0.18, match:namespace waybar
layerrule = ignore_alpha 0.10, match:namespace wofi
windowrule = float on, match:class arch-pl-powitanie
windowrule = center on, match:class arch-pl-powitanie
windowrule = size 1120 650, match:class arch-pl-powitanie
